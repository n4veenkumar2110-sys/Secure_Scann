<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SecureScan: system audit and digital forensics workbench using Windows audit, Wireshark and Autopsy.">
  <title>SecureScan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="wordmark" href="#overview" data-nav="overview">
        <svg class="wordmark-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/>
          <path d="M7 12h10"/>
        </svg>
        <span class="wordmark-text">SecureScan<small>System audit workbench</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <dl class="tool-status" id="tool-status">
          <dt>Wireshark</dt><dd>Checking</dd>
          <dt>Autopsy</dt><dd>Checking</dd>
        </dl>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="button ghost icon-only menu-button" id="menu-button" aria-label="Open navigation" aria-controls="sidebar"></button>
        <button class="search-trigger" id="search-trigger" aria-label="Search pages, events, users and IPs">
          <span data-icon="search"></span>
          <span class="label-long">Search pages, events, users, IPs</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="topbar-right">
          <span class="conn" id="conn" title="Connection to the local SecureScan server"><span class="conn-dot"></span><span>Connected</span></span>
          <button class="button ghost icon-only" id="theme-button" aria-label="Switch colour theme"></button>
          <button class="button ghost icon-only" id="notif-button" aria-label="Notifications"></button>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1">
        <div class="page-head">
          <div>
            <h1 id="page-title">Overview</h1>
            <p id="page-desc"></p>
          </div>
          <div class="page-actions" id="page-actions"></div>
        </div>
        <div id="demo-notice"></div>
        <div id="page" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div class="panel-scrim" id="panel-scrim"></div>
  <aside class="side-panel" id="side-panel" aria-hidden="true" role="dialog" aria-modal="false" aria-labelledby="side-panel-title"></aside>
  <div id="dialog-root"></div>
  <div id="palette-root"></div>
  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" hidden>

  <script src="app.js"></script>
</body>
</html>
